[package]
name = "vesting"
description = "cargo-near-new-project-description"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.99.1"
repository = "https://github.com/INTEARnear/vesting"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-sandbox = "0.3.12"
near-api = "0.8"
cargo-near-build = "0.11.0"
tokio = { version = "1.12.0", features = ["full"] }
testresult = "0.4.1"
anyhow = "1.0.104"
near-workspaces = { version = "0.23.0", features = ["unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
